name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: git ls-files '*.js' ':!games/morris/vendor/**' | xargs -n1 node --check
      - name: Run project and game tests
        run: |
          node tests/project-check.js
          node tests/connect-four-tests.js
          node tests/othello-tests.js
          node tests/ai-tests.js
          node tests/online-codec-tests.js
          node tests/online-protocol-tests.js
          node tests/morris-draw-tests.js
          node tests/expert-worker-tests.js
      - name: Run browser worker smoke test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/run-browser-worker-smoke.js
