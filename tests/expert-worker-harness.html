<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Morris expert worker smoke test</title>
</head>
<body data-status="running">
  <pre id="result">running</pre>
  <script>
    const result = document.querySelector('#result');
    const worker = new Worker('../games/morris/expert-worker.js?v=1.0.0');
    const timer = setTimeout(() => finish('failed', {error: 'timeout'}), 25000);

    function finish(status, payload) {
      clearTimeout(timer);
      document.body.dataset.status = status;
      result.textContent = JSON.stringify(payload);
      worker.terminate();
    }

    worker.onerror = event => finish('failed', {
      error: event.message,
      file: event.filename,
      line: event.lineno
    });
    worker.onmessage = event => {
      const payload = event.data;
      const move = payload.move;
      const legalOpening = move &&
        move.from === null &&
        Number.isInteger(move.to) &&
        move.to >= 0 &&
        move.to < 24 &&
        move.remove === null;
      finish(!payload.error && legalOpening ? 'passed' : 'failed', payload);
    };
    worker.postMessage({
      id: 1,
      time: 7000,
      state: {
        board: Array(24).fill(null),
        hand: [9, 9],
        turn: 0
      }
    });
  </script>
</body>
</html>
